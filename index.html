<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>会員制バー 顧客管理 デモ</title>
<style>
:root{
  color-scheme: light;
  --bg:#f7f5f2; --card:#ffffff; --ink:#24201d; --sub:#6b625a; --line:#e6e0d8;
  --brand:#8c2f39; --brand-d:#6e2430; --brand-l:#f8ecee; --gold:#a8843f;
  --red:#c62828; --red-l:#fdecea; --orange:#b45f00; --orange-l:#fff4e0;
  --green:#1e7e3e; --green-l:#e6f4ea; --gray-l:#f0ede9; --blue:#2f5f9e; --blue-l:#e9f0fa;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.demo-bar{background:#fff8d6;border-bottom:1px solid #f0dc8a;font-size:13px;padding:6px 16px;text-align:center;color:#6b5600}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hd{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .mk{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px;box-shadow:inset 0 -3px 0 var(--gold)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{text-decoration:none;color:var(--sub);padding:8px 12px;border-radius:8px;font-weight:600;font-size:15px}
nav a.on{background:var(--brand-l);color:var(--brand-d)}
nav a:hover{background:var(--gray-l)}
.who{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px;white-space:nowrap}
.role{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.role.owner{background:var(--brand-l);color:var(--brand-d)}.role.staff{background:var(--gray-l);color:var(--sub)}
@media(max-width:860px){
  header{position:static}
  .hd{gap:8px 12px}
  .who{margin-left:auto}
  nav{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  nav a{white-space:nowrap;flex:0 0 auto}
}
@media(max-width:480px){.who #whoName{display:none}}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:4px 0 16px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:860px){.g4,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.kpi{padding:16px;margin-bottom:0}
.kpi .lb{font-size:13px;color:var(--sub);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;line-height:1.3}
.kpi .s{font-size:13px;color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--gray-l)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-d)}
.btn.warn{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger{color:var(--red);border-color:#f3b8b3}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:14px;font-weight:600;color:var(--sub)}
.fld .req{color:var(--red);font-size:12px;margin-left:4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],input[type=tel],select,textarea{min-height:44px;border:1px solid #cfc7bd;border-radius:10px;padding:8px 12px;background:#fff;width:100%}
textarea{min-height:80px}
input:focus,select:focus,textarea:focus{outline:3px solid #ead0d4;border-color:var(--brand)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form .full{grid-column:1/-1}
@media(max-width:640px){.form{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#faf8f5;color:var(--sub);font-size:13px;font-weight:700}
tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}tbody tr.clk:hover{background:#fbf6f6}
td.num,th.num{text-align:right}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}
.b-red{background:var(--red-l);color:var(--red)}.b-orange{background:var(--orange-l);color:var(--orange)}.b-green{background:var(--green-l);color:var(--green)}.b-gray{background:var(--gray-l);color:var(--sub)}.b-blue{background:var(--blue-l);color:var(--blue)}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
.muted{color:var(--sub);font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #cfc7bd;background:#fff;cursor:pointer;font-weight:600}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#24201d;color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100% - 32px)}
.err{background:var(--red-l);color:var(--red);border:1px solid #f3b8b3;padding:10px 14px;border-radius:10px;font-weight:600;margin-bottom:12px}
.info{background:var(--blue-l);color:var(--blue);padding:10px 14px;border-radius:10px;font-size:14px;margin-bottom:12px}
.login-wrap{max-width:440px;margin:40px auto}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:15px}
.dl dt{color:var(--sub);font-weight:600}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
footer{max-width:1180px;margin:0 auto;padding:0 16px 40px;font-size:13px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.linkbtn{background:none;border:0;color:var(--brand);cursor:pointer;text-decoration:underline;padding:0}
/* 受付 */
.scanbox{display:flex;gap:10px;flex-wrap:wrap}
.scanbox input{flex:1 1 260px;font-size:20px;min-height:56px;letter-spacing:.04em}
.scanbox .btn{min-height:56px}
.mcard{border:2px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.mcard.alert{border-color:var(--red);background:#fffafa}
.mcard.soon{border-color:#f2c27c}
.mname{font-size:24px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.alertbox{background:var(--red);color:#fff;border-radius:10px;padding:12px 16px;font-weight:700;font-size:18px;margin:10px 0}
.alertbox small{display:block;font-weight:500;font-size:14px;opacity:.95}
.soonbox{background:var(--orange-l);color:var(--orange);border-radius:10px;padding:10px 14px;font-weight:700;margin:10px 0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid #cfc7bd;background:#fff;font-size:20px;cursor:pointer}
.stepper output{min-width:36px;text-align:center;font-size:20px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid var(--line);padding-top:8px}
.bars .b{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-width:2px;position:relative}
.bars .b.zero{background:var(--gray-l)}
.barlbl{display:flex;gap:3px;font-size:11px;color:var(--sub)}
.barlbl span{flex:1;text-align:center;min-width:0;overflow:hidden}
.ratio{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--gray-l)}
.ratio .m{background:#4f6d9a}.ratio .f{background:#c4637a}
.cam{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:60;padding:16px}
.cam .in{background:#fff;border-radius:14px;padding:16px;max-width:520px;width:100%}
.cam video{width:100%;border-radius:10px;background:#000}
.bc{display:block;width:100%;height:70px}
/* 会員証シール */
.sheet{display:grid;grid-template-columns:repeat(2,86mm);gap:6mm;justify-content:center}
.sticker{width:86mm;height:54mm;border:1px dashed #bbb;border-radius:3mm;padding:4mm 5mm;display:flex;flex-direction:column;justify-content:space-between;background:#fff;color:#000}
.sticker .t{font-size:10pt;font-weight:700;letter-spacing:.05em}
.sticker svg{width:100%;height:20mm}
.sticker .no{font-size:13pt;font-weight:700;text-align:center;letter-spacing:.15em}
@media(max-width:640px){.sheet{grid-template-columns:1fr}.sticker{width:100%;max-width:86mm;margin:0 auto}}
@media(max-width:640px){td.wrap-sm{white-space:normal;min-width:5em}.dl{grid-template-columns:100px 1fr}.hide-sm{display:none}.card{padding:14px}.kpi .v{font-size:20px!important}th,td{padding:10px 8px}.mname{font-size:20px}}
@media print{
  .demo-bar,header,footer,.noprint{display:none!important}
  body,html{background:#fff}
  main{padding:0;max-width:none}
  .sticker{border:1px dashed #ccc;break-inside:avoid}
}
</style>
</head>
<body>
<div class="demo-bar">これは操作を確かめていただくためのデモです。表示されている店名・人名・会員はすべて架空です。入力した内容はこのブラウザの中にだけ保存されます。</div>
<header id="hdr" hidden>
  <div class="hd">
    <div class="logo"><span class="mk">B</span>会員制バー 顧客管理</div>
    <nav id="nav"></nav>
    <div class="who"><span id="whoName"></span><span id="whoRole" class="role"></span><button class="btn sm" id="logout">ログアウト</button></div>
  </div>
</header>
<main id="app"></main>
<footer id="ftr"><span id="todayLbl"></span><button class="linkbtn" id="resetData">デモのデータを最初の状態に戻す</button></footer>

<script>
"use strict";
/* ===== 基本 ===== */
const KEY = "bar_member_demo_v1";
const qs = new URLSearchParams(location.search);
const TODAY = (qs.get("today") && /^\d{4}-\d{2}-\d{2}$/.test(qs.get("today"))) ? qs.get("today") : ymd(new Date());
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function esc(s){return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function z2(n){return String(n).padStart(2,"0");}
function ymd(d){return d.getFullYear()+"-"+z2(d.getMonth()+1)+"-"+z2(d.getDate());}
function pd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ymd(d);}
function addMonths(s,n){const d=pd(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d);}
function addYears(s,n){return addMonths(s,12*n);}
function diffDays(a,b){return Math.round((pd(a)-pd(b))/86400000);}
function yen(n){return Number(n||0).toLocaleString("ja-JP")+"円";}
function jdate(s){if(!s)return "";const [y,m,d]=s.split("-");return `${y}/${m}/${d}`;}
const WD = ["日","月","火","水","木","金","土"];
function jdw(s){return jdate(s)+"（"+WD[pd(s).getDay()]+"）";}
function weekStart(s){const dow=(pd(s).getDay()+6)%7;return addDays(s,-dow);}
function monthStart(s){return s.slice(0,8)+"01";}
function nowHM(){const d=new Date();return z2(d.getHours())+":"+z2(d.getMinutes());}
function isDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||""))return false;return ymd(pd(s))===s;}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ===== 見本データ（架空） ===== */
const SUR = [["甲野","こうの"],["乙野","おつの"],["丙山","へいやま"],["丁田","ていだ"],["戊川","ぼかわ"],["己原","きはら"],["庚谷","こうや"],["辛島","からしま"],["壬生","みぶ"],["癸本","きもと"],["子安","こやす"],["丑山","うしやま"],["寅田","とらだ"],["卯月","うづき"],["辰巳","たつみ"],["午田","うまだ"],["未森","ひつじもり"],["申川","さるかわ"],["酉井","とりい"],["戌亥","いぬい"]];
const MALE = [["健","けん"],["翔","しょう"],["大輔","だいすけ"],["拓也","たくや"],["誠","まこと"],["亮","りょう"],["隆","たかし"],["浩二","こうじ"],["直樹","なおき"],["和也","かずや"],["悠真","ゆうま"],["蓮","れん"],["修","おさむ"],["哲也","てつや"]];
const FEMALE = [["美咲","みさき"],["彩","あや"],["結衣","ゆい"],["真由","まゆ"],["香織","かおり"],["愛","あい"],["優子","ゆうこ"],["里奈","りな"],["葵","あおい"],["さくら","さくら"]];
const BOTTLES = ["シングルモルト 12年","ブレンデッド ウイスキー","バーボン","芋焼酎","麦焼酎","ブランデー VSOP","ジン","日本酒（四合瓶）"];
const PAYS = ["現金","カード","電子マネー"];
const NAME_NO = n => "M"+String(n).padStart(4,"0");

function seedData(){
  const r = rng(5347927), pick = a => a[Math.floor(r()*a.length)], between = (a,b) => Math.floor(a + r()*(b-a+1));
  const users = [
    {id:1,name:"甲野 太郎",email:"owner@example.com",role:"owner"},
    {id:2,name:"乙野 花子",email:"staff@example.com",role:"staff"},
    {id:3,name:"丙山 一郎",email:"staff2@example.com",role:"staff"}
  ];
  const settings = {feeAmount:10000, bottleMonths:6};
  const members = [], fees = [];
  let fid = 0;
  for(let i=0;i<120;i++){
    const male = r() < 0.68;
    const s = pick(SUR), g = pick(male?MALE:FEMALE);
    let joined = addDays(TODAY,-between(12,1080));
    members.push({id:i+1,no:NAME_NO(i+1),name:`${s[0]} ${g[0]}`,kana:`${s[1]} ${g[1]}`,gender:male?"男性":"女性",
      birth:`${between(1960,2001)}-${z2(between(1,12))}-${z2(between(1,28))}`,tel:`090-0000-${String(1000+i)}`,email:"",
      joined,feeUntil:"",referrer:i>5&&r()<0.35?NAME_NO(between(1,i)):"",memo:"",w:Math.pow(r(),2.2)+0.02});
  }
  // 見せ場をはっきり作る：期限切れ・30日以内・誕生月
  const setFee = (idx, untilOffset, yearsAgo) => { const m = members[idx]; m.joined = addYears(addDays(TODAY,untilOffset+1),-yearsAgo); };
  [[6,-18,2],[19,-4,1],[33,-41,1],[47,-9,3],[58,-27,2],[71,-63,1]].forEach(a=>setFee(...a));
  [[11,9,1],[24,3,2],[40,17,1],[66,26,1],[88,30,2]].forEach(a=>setFee(...a));
  const lapsed = new Set([6,19,33,47,58,71]), keep = new Set([0,1,2,11,14,20,24,40,66,88]);
  members[0].birth = `1978-${TODAY.slice(5,7)}-${z2(Math.min(28,Number(TODAY.slice(8,10))+5))}`;
  members[0].memo = "ハイボールは濃いめ。カウンター奥の席が好み";
  members[2].memo = "紹介の多い常連さま";
  members.forEach((m,i)=>{
    // 年会費：入会日に1年分、以後は毎年ほぼ期限前後に更新（期限切れの会員は最後の更新をしていない）
    let n = 1; while(addDays(addYears(m.joined,n),-1) < TODAY) n++;
    if(lapsed.has(i)) n--;
    else if(r() < 0.05 && n > 1 && !keep.has(i)) { n--; lapsed.add(i); }
    let from = m.joined;
    for(let k=0;k<n;k++){
      const until = addDays(addYears(m.joined,k+1),-1);
      const date = k===0 ? m.joined : addDays(from,-between(0,12));
      fees.push({id:++fid,mid:m.id,date:date>TODAY?TODAY:date,amount:settings.feeAmount,until,by:pick(["甲野 太郎","乙野 花子"])});
      from = addDays(until,1);
    }
    m.feeUntil = addDays(addYears(m.joined,n),-1);
  });
  // 来店：日曜定休・金土は多め。会員は常連ほど来店が多い／一部は会員以外
  const visits = [];
  let vid = 0;
  const start = addDays(TODAY,-430);
  for(let d=start; d<TODAY; d=addDays(d,1)){
    const dow = pd(d).getDay();
    if(dow===0) continue;
    const groups = between(4,9) + (dow===5||dow===6 ? between(3,6) : 0);
    const pool = members.filter(m=>m.joined<=d);
    const tot = pool.reduce((a,m)=>a+m.w,0);
    for(let k=0;k<groups;k++){
      let mid = null, men = 0, women = 0;
      if(r() < 0.88 && pool.length){
        let x = r()*tot, m = pool[0];
        for(const p of pool){ x -= p.w; if(x<=0){ m=p; break; } }
        mid = m.id; if(m.gender==="男性") men++; else women++;
        const comp = r()<0.45 ? 0 : between(1,3);
        for(let c=0;c<comp;c++){ if(r()<0.55) men++; else women++; }
      } else {
        const p = between(1,3);
        for(let c=0;c<p;c++){ if(r()<0.6) men++; else women++; }
      }
      const ppl = men+women;
      let amount = ppl*between(55,170)*100 + (r()<0.12 ? between(150,300)*100 : 0);
      const h = between(19,25), mi = pick([0,10,15,20,30,40,45,50]);
      visits.push({id:0,mid,date:d,time:`${z2(h%24)}:${z2(mi)}`,late:h>=24,men,women,amount,pay:pick(PAYS),by:pick(["甲野 太郎","乙野 花子","丙山 一郎"]),memo:""});
    }
  }
  visits.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:((a.late?1:0)-(b.late?1:0))||(a.time<b.time?-1:1));
  visits.forEach(v=>{v.id=++vid;delete v.late;});
  // 今日：会計済み2組・在店中2組
  [[3,"19:10",2,0,24800,"カード"],[15,"19:45",1,1,18600,"現金"],[2,"20:05",1,0,null,""],[21,"20:30",2,1,null,""]].forEach(([mid,time,men,women,amount,pay])=>{
    visits.push({id:++vid,mid,date:TODAY,time,men,women,amount,pay,by:"乙野 花子",memo:""});
  });
  // ボトルキープ
  const bottles = [];
  let bid = 0;
  const bm = [1,1,3,5,8,9,10,13,14,16,18,22,23,25,27,29,30,31,35,37,39,42,44,45,50,52,55,57,61,63,68,70,74,77,80,83,90,95,101,110];
  bm.forEach((mid,i)=>{
    const opened = addDays(TODAY,-between(10,230));
    const until = addMonths(opened,settings.bottleMonths);
    const done = i%6===5;
    bottles.push({id:++bid,mid,name:i<2?(i===0?"シングルモルト 12年":"芋焼酎"):pick(BOTTLES),opened,until,level:i===0?"半分":pick(["多い","半分","少ない"]),status:done?"終了":"キープ中",closed:done?addDays(opened,between(5,60)):""});
  });
  members.forEach(m=>delete m.w);
  return {ver:1,seededFor:TODAY,settings,users,members,fees,visits,bottles,seq:{m:members.length,f:fid,v:vid,b:bid,u:users.length}};
}

let S;
function load(){
  try{
    const j=JSON.parse(localStorage.getItem(KEY)||"null");
    if(j&&j.ver===1){
      // デモの日付は開いた日に合わせて前後へずらす（入力した記録も同じ日数だけずれる）
      const d=diffDays(TODAY,j.seededFor);
      if(d!==0){
        const sh=s=>s?addDays(s,d):s;
        j.members.forEach(m=>{m.joined=sh(m.joined);m.feeUntil=sh(m.feeUntil);});
        j.fees.forEach(f=>{f.date=sh(f.date);f.until=sh(f.until);});
        j.visits.forEach(v=>{v.date=sh(v.date);});
        j.bottles.forEach(b=>{b.opened=sh(b.opened);b.until=sh(b.until);b.closed=sh(b.closed);});
        j.seededFor=TODAY;
      }
      return j;
    }
  }catch(e){}
  return seedData();
}

  if(/^\d{1,6}$/.test(s)) return NAME_NO(Number(s));

function feeState(m){

}
function nextUntil(m){

function bottleState(b){

}
function memberStats(){

/* ===== バーコード（Code39：USBリーダー・スマホのどちらでも読める方式） ===== */
const C39 = {"0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw","5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn",
"A":"wnnnnwnnw","B":"nnwnnwnnw","C":"wnwnnwnnn","D":"nnnnwwnnw","E":"wnnnwwnnn","F":"nnwnwwnnn","G":"nnnnnwwnw","H":"wnnnnwwnn","I":"nnwnnwwnn","J":"nnnnwwwnn",
"K":"wnnnnnnww","L":"nnwnnnnww","M":"wnwnnnnwn","N":"nnnnwnnww","O":"wnnnwnnwn","P":"nnwnwnnwn","Q":"nnnnnnwww","R":"wnnnnnwwn","S":"nnwnnnwwn","T":"nnnnwnwwn",
"U":"wwnnnnnnw","V":"nwwnnnnnw","W":"wwwnnnnnn","X":"nwnnwnnnw","Y":"wwnnwnnnn","Z":"nwwnwnnnn","-":"nwnnnnwnw",".":"wwnnnnwnn"," ":"nwwnnnwnn","*":"nwnnwnwnn"};
function code39svg(text){
  const n=2, w=6, h=70, q=20;
  let x=q, rects="";
  const s="*"+text+"*";
  for(let i=0;i<s.length;i++){
    const p=C39[s[i]]; if(!p) continue;
    for(let j=0;j<9;j++){
      const ww=p[j]==="w"?w:n;
      if(j%2===0) rects+=`<rect x="${x}" y="0" width="${ww}" height="${h}"/>`;
      x+=ww;
    }
    x+=n;
  }
  const W=x-n+q;
  return `<svg class="bc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" role="img" aria-label="会員番号 ${esc(text)} のバーコード"><rect width="${W}" height="${h}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

async function openCamera(){

  document.body.appendChild(ov);

    const det=new BarcodeDetector({formats:["code_39","qr_code"]});

    loop();

  const lbl=()=>{const a=$("#vAmount").value;$("#vAmountLbl").textContent=a!==""&&/^\d+$/.test(a)?yen(Number(a)):"";};lbl();

  $$("#vPay button").forEach(b=>b.onclick=()=>{st.pay=b.dataset.p;$$("#vPay button").forEach(x=>x.classList.toggle("on",x===b));});
  $("#vSave").onclick=()=>{
    const errs=[]; const date=$("#vDate").value, time=$("#vTime").value, a=$("#vAmount").value.trim();
    if(!isDate(date)) errs.push("日付を入力してください"); else if(date>TODAY) errs.push("未来の日付は記録できません");
    if(!/^\d{2}:\d{2}$/.test(time)) errs.push("来店時刻を入力してください");
    if(st.men+st.women<1) errs.push("人数を1名以上にしてください");
    if(a===""&&!isNew) errs.push("お会計の金額を入力してください");
    if(a!==""&&!/^\d+$/.test(a)) errs.push("お会計は0以上の整数（円）で入力してください");

    const rec=v||{id:++S.seq.v,mid:null,by:ME.name};

    if(isNew) S.visits.push(rec);
    save(); toast(a===""?"在店中として記録しました":"会計を記録しました"); go("#/home");
  };
  const d=$("#vDel"); if(d) d.onclick=()=>{if(!confirm("この来店の記録を削除します。よろしいですか？"))return;S.visits=S.visits.filter(x=>x.id!==v.id);save();toast("削除しました");go("#/home");};
}

    if(!gender) errs.push("性別を選んでください");
    if(!isDate(joined)) errs.push("入会日を入力してください"); else if(joined>TODAY) errs.push("入会日に未来の日付は入れられません");
    if(!isDate(until)) errs.push("年会費の期限を入力してください"); else if(isDate(joined)&&until<joined) errs.push("年会費の期限は入会日より後にしてください");
    if(birth&&!isDate(birth)) errs.push("生年月日を正しく入力してください");
    if(ref&&!mByNo(ref)) errs.push("紹介者の会員番号が見つかりません");
    if(ref&&ref===no) errs.push("紹介者に本人は指定できません");
    if(errs.length){$("#ferr").innerHTML=`<div class="err">${errs.map(esc).join("<br>")}</div>`;window.scrollTo(0,0);return;}
    const rec=m||{id:++S.seq.m};
    Object.assign(rec,{no,name,kana:$("#fKana").value.trim(),gender,birth,tel:$("#fTel").value.trim(),email:$("#fMail").value.trim(),joined,feeUntil:until,referrer:ref,memo:$("#fMemo").value.trim()});
    if(isNew){S.members.push(rec); if($("#fFee").checked) S.fees.push({id:++S.seq.f,mid:rec.id,date:joined,amount:S.settings.feeAmount,until,by:ME.name});}
    save(); toast(isNew?"会員を登録しました":"保存しました"); go("#/member/"+rec.id);
  };
}

/* ===== 売上レポート ===== */
let RP = {mode:"month",from:"",to:""};
function periodOf(){
  let f,t,pf,pt,label;
  if(RP.mode==="week"){f=weekStart(TODAY);t=TODAY;pf=addDays(f,-7);pt=addDays(t,-7);label="今週";}
  else if(RP.mode==="lastweek"){f=addDays(weekStart(TODAY),-7);t=addDays(f,6);pf=addDays(f,-7);pt=addDays(t,-7);label="先週";}
  else if(RP.mode==="lastmonth"){f=addMonths(monthStart(TODAY),-1);t=addDays(monthStart(TODAY),-1);pf=addMonths(f,-1);pt=addDays(f,-1);label="先月";}
  else if(RP.mode==="custom"){f=RP.from;t=RP.to;const len=diffDays(t,f)+1;pt=addDays(f,-1);pf=addDays(pt,-(len-1));label="指定した期間";}
  else {f=monthStart(TODAY);t=TODAY;pf=addMonths(f,-1);pt=addMonths(TODAY,-1);label="今月";}
  return {f,t,pf,pt,label};
}
function stats(f,t){
  const vs=S.visits.filter(v=>v.amount!=null&&v.date>=f&&v.date<=t);
  const sales=vs.reduce((a,v)=>a+v.amount,0), men=vs.reduce((a,v)=>a+v.men,0), women=vs.reduce((a,v)=>a+v.women,0);
  const guests=men+women;
  const fee=S.fees.filter(x=>x.date>=f&&x.date<=t).reduce((a,x)=>a+x.amount,0);
  const joined=S.members.filter(m=>m.joined>=f&&m.joined<=t).length;
  return {vs,sales,groups:vs.length,guests,men,women,avg:guests?Math.round(sales/guests):0,avgG:vs.length?Math.round(sales/vs.length):0,fee,joined,memberGroups:vs.filter(v=>v.mid).length};
}
function pct(a,b){if(!b)return "";const p=Math.round((a-b)/b*1000)/10;return `<span class="${p>=0?"up":"down"}">${p>=0?"+":""}${p}%</span>`;}
function ratioTxt(s){return s.guests?`男性 ${Math.round(s.men/s.guests*100)}%・女性 ${100-Math.round(s.men/s.guests*100)}%`:"—";}
function viewReport(){
  const P=periodOf(), cur=stats(P.f,P.t), prev=stats(P.pf,P.pt);
  const weekly=RP.mode==="week"||RP.mode==="lastweek";
  const trend=[];
  if(weekly){for(let i=7;i>=0;i--){const f=addDays(weekStart(TODAY),-7*i);let t=addDays(f,6);if(t>TODAY)t=TODAY;trend.push({label:`${jdate(f).slice(5)}〜`,f,t,s:stats(f,t)});}}
  else{for(let i=11;i>=0;i--){const f=addMonths(monthStart(TODAY),-i);let t=addDays(addMonths(f,1),-1);if(t>TODAY)t=TODAY;trend.push({label:`${f.slice(0,4)}年${Number(f.slice(5,7))}月`,f,t,s:stats(f,t)});}}
  const days=[]; const span=diffDays(P.t,P.f);
  if(span>=0&&span<=62){for(let d=P.f;d<=P.t;d=addDays(d,1)) days.push({d,sum:cur.vs.filter(v=>v.date===d).reduce((a,v)=>a+v.amount,0)});}
  const maxD=Math.max(1,...days.map(x=>x.sum));
  const wd=[1,2,3,4,5,6,0].map(w=>{const vs=cur.vs.filter(v=>pd(v.date).getDay()===w);const n=new Set(vs.map(v=>v.date)).size;return {w,sum:vs.reduce((a,v)=>a+v.amount,0),groups:vs.length,days:n};});
  const byM=new Map(); cur.vs.forEach(v=>{if(!v.mid)return;const x=byM.get(v.mid)||{n:0,sum:0,ppl:0};x.n++;x.sum+=v.amount;x.ppl+=v.men+v.women;byM.set(v.mid,x);});
  const rank=[...byM.entries()].sort((a,b)=>b[1].sum-a[1].sum).slice(0,10);
  const st=memberStats();
  const away=S.members.filter(m=>feeState(m).k!=="over").map(m=>({m,last:(st.get(m.id)||{}).last||""})).filter(x=>!x.last||diffDays(TODAY,x.last)>=60).sort((a,b)=>(a.last||"0").localeCompare(b.last||"0")).reverse();
  const mm=TODAY.slice(5,7), bday=S.members.filter(m=>m.birth&&m.birth.slice(5,7)===mm).sort((a,b)=>a.birth.slice(8)<b.birth.slice(8)?-1:1);
  const kpi=(id,lb,v,pv,fmt)=>`<div class="card kpi"><div class="lb">${lb}</div><div class="v" id="${id}">${fmt(v)}</div><div class="s">前の期間 ${fmt(pv)} ${pct(v,pv)}</div></div>`;
  $("#app").innerHTML=`<h1>売上レポート</h1>
  <div class="card">
    <div class="seg" id="rSeg">${[["week","今週"],["lastweek","先週"],["month","今月"],["lastmonth","先月"],["custom","期間を指定"]].map(([k,l])=>`<button data-m="${k}" class="${RP.mode===k?"on":""}">${l}</button>`).join("")}</div>
    <div class="row" id="rCustom" style="margin-top:12px" ${RP.mode==="custom"?"":"hidden"}>
      <div class="fld"><label for="rFrom">はじめ</label><input type="date" id="rFrom" value="${esc(RP.from)}" max="${TODAY}"></div>
      <div class="fld"><label for="rTo">おわり</label><input type="date" id="rTo" value="${esc(RP.to)}" max="${TODAY}"></div>
      <button class="btn pri" id="rApply">表示する</button>
    </div>
    <p class="muted" style="margin:10px 0 0" id="periodLbl">${P.label}：${jdw(P.f)}〜${jdw(P.t)}　／　くらべる期間：${jdate(P.pf)}〜${jdate(P.pt)}</p>
  </div>
  <div class="grid g4" style="margin-bottom:16px">
    ${kpi("rSales","売上（飲食）",cur.sales,prev.sales,yen)}
    ${kpi("rGroups","来店組数",cur.groups,prev.groups,x=>x+"組")}
    ${kpi("rGuests","来店客数",cur.guests,prev.guests,x=>x+"名")}
    ${kpi("rAvg","客単価（1人あたり）",cur.avg,prev.avg,yen)}
  </div>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card kpi"><div class="lb">男女比（来店客）</div><div class="v" style="font-size:20px" id="rRatio">${ratioTxt(cur)}</div><div class="ratio" style="margin-top:6px"><div class="m" style="width:${cur.guests?cur.men/cur.guests*100:0}%"></div><div class="f" style="width:${cur.guests?cur.women/cur.guests*100:0}%"></div></div><div class="s">前の期間 ${ratioTxt(prev)}</div></div>
    <div class="card kpi"><div class="lb">1組あたりの平均</div><div class="v" id="rAvgG">${yen(cur.avgG)}</div><div class="s">会員のご来店 ${cur.memberGroups}組／会員以外 ${cur.groups-cur.memberGroups}組</div></div>
    <div class="card kpi"><div class="lb">年会費の受け取り（別計上）</div><div class="v" id="rFee">${yen(cur.fee)}</div><div class="s">新しく入会 ${cur.joined}人</div></div>
  </div>
  ${days.length?`<div class="card"><h2>日ごとの売上</h2><div class="bars" id="rBars">${days.map(x=>`<div class="b ${x.sum?"":"zero"}" style="height:${Math.max(2,x.sum/maxD*100)}%" title="${jdw(x.d)} ${yen(x.sum)}"></div>`).join("")}</div><div class="barlbl">${days.map((x,i)=>`<span>${i%Math.ceil(days.length/10)===0?Number(x.d.slice(8)):""}</span>`).join("")}</div><p class="muted" style="margin:6px 0 0">日曜は定休日のため0円です（見本データ）。</p></div>`:""}
  <div class="card"><h2>${weekly?"週ごと":"月ごと"}の推移</h2>
    <div class="tbl-wrap"><table><thead><tr><th>${weekly?"週（月曜はじまり）":"月"}</th><th class="num">売上</th><th class="num">組数</th><th class="num hide-sm">客数</th><th class="num">客単価</th><th class="hide-sm">男女比</th></tr></thead><tbody id="rTrend">
    ${trend.map(x=>`<tr><td>${x.label}</td><td class="num">${yen(x.s.sales)}</td><td class="num">${x.s.groups}組</td><td class="num hide-sm">${x.s.guests}名</td><td class="num">${yen(x.s.avg)}</td><td class="hide-sm">${ratioTxt(x.s)}</td></tr>`).join("")}
    </tbody></table></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>曜日ごと</h2>
      <div class="tbl-wrap"><table><thead><tr><th>曜日</th><th class="num">売上</th><th class="num">組数</th><th class="num">1日平均</th></tr></thead><tbody id="rWd">
      ${wd.map(x=>`<tr><td>${WD[x.w]}曜</td><td class="num">${yen(x.sum)}</td><td class="num">${x.groups}組</td><td class="num">${x.days?yen(Math.round(x.sum/x.days)):"—"}</td></tr>`).join("")}
      </tbody></table></div>
    </div>
    <div class="card"><h2>会員ごとの売上（上位10人）</h2>
      <div class="tbl-wrap"><table><thead><tr><th>会員</th><th class="num">来店</th><th class="num">売上</th><th class="num hide-sm">客単価</th></tr></thead><tbody id="rRank">
      ${rank.map(([mid,x])=>{const m=mById(mid);return `<tr class="clk" data-go="#/member/${mid}"><td>${esc(m.no)} ${esc(m.name)}</td><td class="num">${x.n}回</td><td class="num">${yen(x.sum)}</td><td class="num hide-sm">${yen(Math.round(x.sum/x.ppl))}</td></tr>`;}).join("")||`<tr><td colspan="4" class="muted">この期間の会員のご来店はありません</td></tr>`}
      </tbody></table></div>
    </div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>しばらく来ていない会員（60日以上）</h2>
      <p class="muted" style="margin-top:0">年会費が有効なのに60日以上ご来店のない会員です。ご案内の連絡先として使えます。</p>
      <p><b id="rAway">${away.length}人</b></p>
      <div class="tbl-wrap"><table><thead><tr><th>会員</th><th>最後の来店</th></tr></thead><tbody id="rAwayList">${away.slice(0,8).map(x=>`<tr class="clk" data-go="#/member/${x.m.id}"><td>${esc(x.m.no)} ${esc(x.m.name)}</td><td>${x.last?jdate(x.last)+`（${diffDays(TODAY,x.last)}日前）`:"来店なし"}</td></tr>`).join("")||`<tr><td colspan="2" class="muted">該当なし</td></tr>`}</tbody></table></div>
    </div>
    <div class="card"><h2>今月が誕生日の会員</h2>
      <p class="muted" style="margin-top:0">お祝いのご案内やサービスに使えます。</p>
      <div class="tbl-wrap"><table><thead><tr><th>会員</th><th>誕生日</th></tr></thead><tbody id="rBday">${bday.map(m=>`<tr class="clk" data-go="#/member/${m.id}"><td>${esc(m.no)} ${esc(m.name)}</td><td>${Number(m.birth.slice(5,7))}月${Number(m.birth.slice(8))}日</td></tr>`).join("")||`<tr><td colspan="2" class="muted">該当なし</td></tr>`}</tbody></table></div>
    </div>
  </div>

  </div>`;

    if(b.dataset.m==="custom"){ if(!RP.from){RP.from=monthStart(TODAY);RP.to=TODAY;} }

  $("#rApply").onclick=()=>{const f=$("#rFrom").value,t=$("#rTo").value;if(!isDate(f)||!isDate(t)||f>t){toast("期間の「はじめ」と「おわり」を正しく入れてください");return;}RP.from=f;RP.to=t>TODAY?TODAY:t;viewReport();};

  $("#csvSum").onclick=()=>csv(`売上集計_${P.f}_${P.t}.csv`,[["項目","この期間","前の期間"],["期間",`${P.f}〜${P.t}`,`${P.pf}〜${P.pt}`],["売上（飲食）",cur.sales,prev.sales],["来店組数",cur.groups,prev.groups],["来店客数",cur.guests,prev.guests],["客単価",cur.avg,prev.avg],["男性",cur.men,prev.men],["女性",cur.women,prev.women],["年会費",cur.fee,prev.fee],["新規入会",cur.joined,prev.joined],[],["会員番号","氏名","来店回数","売上"],...rank.map(([mid,x])=>[mById(mid).no,mById(mid).name,x.n,x.sum])]);
  $("#csvDetail").onclick=()=>csv(`来店明細_${P.f}_${P.t}.csv`,[["日付","時刻","会員番号","氏名","男性","女性","お会計","お支払い","メモ"],...cur.vs.map(v=>{const m=v.mid?mById(v.mid):null;return [v.date,v.time,m?m.no:"",m?m.name:"会員以外",v.men,v.women,v.amount,v.pay,v.memo];})]);
  $("#csvAway").onclick=()=>csv(`しばらく来ていない会員_${TODAY}.csv`,[["会員番号","氏名","電話","最後の来店","年会費の期限"],...away.map(x=>[x.m.no,x.m.name,x.m.tel,x.last,x.m.feeUntil])]);
}

    if(!n) errs.push("名前を入力してください");
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) errs.push("メールアドレスを正しく入力してください");
    else if(S.users.some(u=>u.email===e)) errs.push("同じメールアドレスの人がすでにいます");
    if(errs.length){$("#uerr").innerHTML=`<div class="err">${errs.join("<br>")}</div>`;return;}
    S.users.push({id:++S.seq.u,name:n,email:e,role:"staff"});save();viewSettings("スタッフを追加しました（パスワードはデモでは「demo」）");
  };
  $("#tplCsv").onclick=()=>csv("会員名簿_取り込み用ひな形.csv",[IMP_COLS,["","甲野 次郎","こうの じろう","男性","1980-04-01","090-0000-0000","2025-11-01","2026-10-31","カウンター席が好み"]]);
  $("#impFile").onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>importPreview(String(rd.result));rd.readAsText(file,"utf-8");e.target.value="";};
}
const IMP_COLS=["会員番号","氏名","ふりがな","性別","生年月日","電話","入会日","年会費の期限","メモ"];
function parseCsv(text){
  text=text.replace(/^﻿/,"");
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function normDate(s){s=String(s||"").trim().replace(/\//g,"-");const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(!m)return s?null:"";const d=`${m[1]}-${z2(m[2])}-${z2(m[3])}`;return isDate(d)?d:null;}
let IMP=null;
function importPreview(text){
  const rows=parseCsv(text); const box=$("#impResult");
  if(!rows.length){box.innerHTML=`<div class="err">ファイルが空です</div>`;return;}
  const head=rows[0].map(h=>h.trim()); const ix=Object.fromEntries(IMP_COLS.map(c=>[c,head.indexOf(c)]));
  if(ix["氏名"]<0){box.innerHTML=`<div class="err">1行目に「氏名」の列が見つかりません。ひな形の1行目をそのまま使ってください。</div>`;return;}
  const ok=[], bad=[]; const used=new Set(S.members.map(m=>m.no));
  let seqN=Number(nextNo().slice(1));
  rows.slice(1).forEach((r,k)=>{
    const g=c=>ix[c]>=0?String(r[ix[c]]??"").trim():"";
    const line=k+2, errs=[];
    const name=g("氏名"); if(!name) errs.push("氏名が空です");
    let gender=g("性別"); gender=gender==="男"?"男性":gender==="女"?"女性":gender;
    if(!["男性","女性","その他"].includes(gender)) errs.push("性別は 男性／女性／その他 で入れてください");
    const birth=normDate(g("生年月日")); if(birth===null) errs.push("生年月日の形が違います");
    let joined=normDate(g("入会日")); if(joined===null) errs.push("入会日の形が違います"); else if(joined>TODAY) errs.push("入会日が未来です");
    if(joined==="") joined=TODAY;
    let until=normDate(g("年会費の期限")); if(until===null) errs.push("年会費の期限の形が違います");
    if(until===""&&joined) until=addDays(addYears(joined,1),-1);
    let no=g("会員番号");
    if(no){no=normNo(no);if(!/^M\d{4,6}$/.test(no))errs.push("会員番号の形が違います");else if(used.has(no))errs.push(`会員番号 ${no} はすでに使われています`);}
    if(errs.length){bad.push({line,name,errs});return;}
    if(!no){while(used.has(NAME_NO(seqN)))seqN++;no=NAME_NO(seqN++);}
    used.add(no);
    ok.push({no,name,kana:g("ふりがな"),gender,birth,tel:g("電話"),email:"",joined,feeUntil:until,referrer:"",memo:g("メモ")});
  });
  IMP=ok;
  box.innerHTML=`<div class="info" id="impSummary">取り込める行：${ok.length}件／直す必要がある行：${bad.length}件</div>
  ${bad.length?`<div class="err" id="impErrors">${bad.map(b=>`${b.line}行目${b.name?"（"+esc(b.name)+"）":""}：${b.errs.map(esc).join("・")}`).join("<br>")}</div>`:""}
  ${ok.length?`<div class="tbl-wrap" style="margin-bottom:12px"><table><thead><tr><th>会員番号</th><th>氏名</th><th>性別</th><th>入会日</th><th>年会費の期限</th></tr></thead><tbody>${ok.slice(0,20).map(m=>`<tr><td>${esc(m.no)}</td><td>${esc(m.name)}</td><td>${esc(m.gender)}</td><td>${jdate(m.joined)}</td><td>${jdate(m.feeUntil)}</td></tr>`).join("")}</tbody></table></div>
  <button class="btn pri" id="impGo">${ok.length}件を取り込む</button>`:""}`;
  const go2=$("#impGo"); if(go2) go2.onclick=()=>{IMP.forEach(m=>S.members.push({id:++S.seq.m,...m}));save();const n=IMP.length;IMP=null;viewSettings(`${n}件の会員を取り込みました`);};
}

    <div class="row"><button class="btn pri" id="doPrint">印刷する</button><a class="btn" href="#/members">会員一覧へ戻る</a></div></div></div>
  <div class="sheet" id="sheet">${ms.map(m=>`<div class="sticker" data-no="${esc(m.no)}"><div class="t">MEMBERS CARD</div>${code39svg(m.no)}<div class="no">${esc(m.no)}</div></div>`).join("")||`<p class="muted">印刷する会員が選ばれていません</p>`}</div>`;

/* ===== CSV ===== */
function csv(name,rows){
  const body=rows.map(r=>r.map(x=>{const s=String(x??"");return /[",\r\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+body],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
